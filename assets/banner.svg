<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Arthur Torres - Desenvolvedor Backend</title>
  <desc id="desc">Banner azul e roxo com apresentação profissional e uma janela de terminal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#101a36"/>
      <stop offset="1" stop-color="#241248"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="160" cy="30" rx="350" ry="260" fill="url(#glowBlue)"/>
  <ellipse cx="1080" cy="340" rx="420" ry="300" fill="url(#glowPurple)"/>

  <g transform="translate(62 66)">
    <rect width="238" height="34" rx="17" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.45"/>
    <circle cx="18" cy="17" r="5" fill="#3fb950"/>
    <text x="32" y="23" fill="#c9d1d9" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="600" letter-spacing="1.4">BACKEND DEVELOPER</text>

    <text x="0" y="103" fill="#f0f6fc" font-size="55" font-family="Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="1">ARTHUR TORRES</text>
    <rect y="122" width="560" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="167" fill="#bc8cff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">C#  •  .NET  •  PYTHON  •  SQL</text>
    <text x="0" y="205" fill="#8b949e" font-size="19" font-family="Segoe UI, Arial, sans-serif">
      <tspan x="0" dy="0">Se eu não consigo explicar o código,</tspan>
      <tspan x="0" dy="28">ainda não terminei de aprender.</tspan>
    </text>
  </g>

  <g transform="translate(700 58)" filter="url(#shadow)">
    <rect width="438" height="246" rx="16" fill="#080b12" stroke="#30363d"/>
    <path d="M0 46H438" stroke="#30363d"/>
    <circle cx="24" cy="23" r="6" fill="#ff7b72"/>
    <circle cx="46" cy="23" r="6" fill="#d29922"/>
    <circle cx="68" cy="23" r="6" fill="#3fb950"/>
    <text x="219" y="29" text-anchor="middle" fill="#6e7681" font-size="14" font-family="Consolas, monospace">arthur@backend:~</text>

    <text x="24" y="80" fill="#3fb950" font-size="16" font-family="Consolas, monospace">$</text>
    <text x="44" y="80" fill="#c9d1d9" font-size="16" font-family="Consolas, monospace">dotnet run</text>
    <text x="24" y="112" fill="#8b949e" font-size="15" font-family="Consolas, monospace">Building...</text>
    <text x="24" y="142" fill="#58a6ff" font-size="15" font-family="Consolas, monospace">API online</text>
    <text x="110" y="142" fill="#6e7681" font-size="15" font-family="Consolas, monospace">•</text>
    <text x="128" y="142" fill="#bc8cff" font-size="15" font-family="Consolas, monospace">aprendendo na prática</text>
    <text x="24" y="178" fill="#3fb950" font-size="16" font-family="Consolas, monospace">$</text>
    <text x="44" y="178" fill="#c9d1d9" font-size="16" font-family="Consolas, monospace">git status</text>
    <text x="24" y="210" fill="#8b949e" font-size="15" font-family="Consolas, monospace">Próximo commit: primeira API pública</text>
    <rect x="24" y="224" width="9" height="3" fill="#58a6ff"/>
  </g>

  <rect y="352" width="1200" height="8" rx="4" fill="url(#accent)"/>
</svg>
