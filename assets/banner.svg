<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arthur Torres - Back-end C# e .NET, APIs e Python</title>
  <desc id="desc">Banner monocromático inspirado em um terminal, com uma API conectada a um banco de dados.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B0F"/>
      <stop offset="1" stop-color="#11151B"/>
    </linearGradient>
    <linearGradient id="fade" x1="750" y1="180" x2="1210" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="80" y="75" fill="#7D8590" font-size="16" letter-spacing="2">~/ARTHUR/PROFILE</text>
    <text x="78" y="154" fill="#F0F6FC" font-size="58" font-weight="700" letter-spacing="-2">Arthur Torres</text>
    <text x="80" y="202" fill="#B1BAC4" font-size="23" font-weight="600" letter-spacing="1.5">BACK-END C#/.NET • APIs • PYTHON</text>
    <text x="80" y="252" fill="#7D8590" font-size="18">ideia</text>
    <text x="138" y="252" fill="#484F58" font-size="18">→</text>
    <text x="170" y="252" fill="#B1BAC4" font-size="18">arquitetura</text>
    <text x="286" y="252" fill="#484F58" font-size="18">→</text>
    <text x="318" y="252" fill="#F0F6FC" font-size="18">código</text>
    <text x="80" y="310" fill="#484F58" font-size="15">C#  /  .NET  /  PYTHON  /  SQL  /  POSTGRESQL</text>
  </g>

  <g transform="translate(745 57)">
    <rect width="455" height="246" rx="14" fill="#0D1117" stroke="url(#fade)" stroke-width="2"/>
    <path d="M0 44H455" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="4" fill="#484F58"/>
    <circle cx="38" cy="22" r="4" fill="#6E7681"/>
    <circle cx="54" cy="22" r="4" fill="#B1BAC4"/>
    <text x="226" y="28" text-anchor="middle" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">arthur@linux: ~/gueto-api</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
      <text x="24" y="79" fill="#7D8590">$</text>
      <text x="45" y="79" fill="#F0F6FC">dotnet run</text>
      <text x="24" y="111" fill="#7D8590">info:</text>
      <text x="78" y="111" fill="#B1BAC4">API listening on :5000</text>
      <text x="24" y="143" fill="#7D8590">GET</text>
      <text x="67" y="143" fill="#F0F6FC">/api/servicos</text>
      <text x="237" y="143" fill="#B1BAC4">200 OK</text>
      <text x="24" y="175" fill="#7D8590">DB</text>
      <text x="67" y="175" fill="#F0F6FC">PostgreSQL</text>
      <text x="184" y="175" fill="#7D8590">data layer</text>
      <text x="24" y="215" fill="#B1BAC4">building_systems()</text>
      <rect x="205" y="199" width="9" height="20" fill="#F0F6FC">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <circle cx="1200" cy="302" r="24" fill="#FFFFFF" fill-opacity="0.025" filter="url(#softGlow)"/>
</svg>
